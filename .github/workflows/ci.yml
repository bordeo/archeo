name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check action-queue.js
          node --check content.js
          node --check grouping.js
          node --check key-observer.js
          node --check mru.js
          node --check offscreen.js
          node --check popup.js
          node --check settings.js
      - name: Validate JSON
        run: node -e 'for (const file of ["manifest.json", "karabiner/archeo.json"]) JSON.parse(require("fs").readFileSync(file, "utf8"))'
      - name: Run tests
        run: |
          node tests/mru.test.js
          node tests/action-queue.test.js
          node tests/grouping.test.js
          node tests/key-observer.test.js
          node tests/settings.test.js
      - name: Install Lua
        run: sudo apt-get install -y lua5.4
      - name: Test Hammerspoon adapter
        run: lua5.4 tests/hammerspoon.test.lua hammerspoon/archeo.lua
